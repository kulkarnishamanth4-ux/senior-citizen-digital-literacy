name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and prepare assets
        run: |
          npm install --legacy-peer-deps
          cd client
          npm install --legacy-peer-deps
          npm run build
          cd ..
          mkdir -p android/app/src/main/assets/public
          cp -r client/dist/* android/app/src/main/assets/public/

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        id: gradle
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Save build log on failure to branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          tail -n 150 build.log > last_error.txt
          git add last_error.txt
          git commit -m "chore: save build error"
          git push -f origin build-logs

      - name: Copy APK to predictable name
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ElderAssist.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElderAssist-APK
          path: build-output/ElderAssist.apk

      - name: Publish or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: ElderAssist Android App v1.0.0
          body: |
            ## ElderAssist Android App (APK)
            Official Android APK download for the Senior Citizen Smartphone & Digital Literacy Assistant.
            
            ### How to Install:
            1. Download `ElderAssist.apk` below directly to your Android phone.
            2. Open the downloaded file from your notifications or Downloads folder.
            3. Tap **Install** (if prompted "Allow from this source", tap Allow).
            4. The ElderAssist app will appear on your phone home screen!
          files: build-output/ElderAssist.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
